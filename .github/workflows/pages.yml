name: Deploy CRA to GitHub Pages

on:
  push:
    branches: [main] # change if your default branch is different
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install deps
        run: npm ci

      # If you DID NOT add "homepage" in package.json, uncomment next 3 lines:
      # - name: Build
      #   run: PUBLIC_URL="https://<your-username>.github.io/<your-repo>" npm run build

      # If you DID add "homepage", keep this:
      - name: Build
        run: npm run build

      # SPA fallback so refresh on routes doesn't 404
      - name: Add SPA 404 fallback
        run: cp build/index.html build/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
